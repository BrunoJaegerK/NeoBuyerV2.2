# Configuración principal de NeoBuyer.
# Los artículos se definen al final del archivo con su ID, cantidad y precio.

# Variación de precios según el volumen de ventas.
# 0.2 equivale al 20 %.
price-ratio: 0.2

# Coeficiente de ajuste según el nivel del comprador.
# 0.1 equivale al 10 %.
level-ratio: 0.1

# Tiempo en minutos entre actualizaciones y reinicios del contador de ventas.
update-period: 60

# Mensaje global cuando se actualiza la tienda.
update-message: "¡La tienda ha sido actualizada!"

# Aviso emergente de las ventas automáticas.
# Variables: {item_name}, {amount}, {boost}
sale-popup: "¡Vendiste {item_name} por {amount} monedas! (Boost: {boost})"

# Configuración de venta automática.
auto-buyer:
  # Activa o desactiva la compatibilidad con recursos sin procesar.
  resources-enabled: true
  # Relación entre el ID del recurso y el ID del producto final.
  resources:
    "15": 265  # Mineral de hierro -> Lingote de hierro
    "14": 266  # Mineral de oro -> Lingote de oro
    "56": 264  # Mineral de diamante -> Diamante
    "129": 388 # Mineral de esmeralda -> Esmeralda
    "153": 406 # Mineral de cuarzo -> Cuarzo

# Personalización de los formularios.
buyer-form:
  title: "§l§aComprador"
  content: |
    ¡Bienvenido al comprador!§r§f
    Ten el artículo en tu inventario para poder venderlo.
  button-template: "{item_name} x{item_count} - §a{price} monedas§r§f"
  tutorial-title: "§l§aInformación"
  item-form-content: |
    Vas a vender §a{item}§r§f
    Precio por unidad: §a{price}§r§f

    Cantidad disponible: §a{available}§r§f
  tutorial-content: |
    La tienda ajusta sus precios según la actividad de ventas.§r§f

    Cuando las ventas son §abajas§r§f, el precio puede subir.
    Cuando las ventas §aaumentan§r§f, el precio puede bajar.

    El coeficiente de variación actual es: §a{ratio}§r§f
    Ajuste por nivel: §a{level-ratio}§r§f
  tutorial-button: "Información y configuración"
  messages:
    not-enough-items: "¡No tienes suficientes artículos para vender!"
    success: "¡Venta realizada! Vendiste {count} artículos y recibiste {amount} monedas. Boost: {boost}"

# Opciones del comprador automático.
settings-form:
  title: "§l§aConfiguración"
  status-label: |
    §aEl comprador automático§r§f facilita tus ventas.

    Recoge los recursos y los artículos compatibles se venderán automáticamente.

    §aNota:§r§f La venta automática funciona con los artículos del menú principal y con los recursos configurados.

    Estado: §a{status}§r§f
  toggle-label: "Activar o desactivar el comprador automático"
  messages:
    enabled: "Comprador automático activado."
    disabled: "Comprador automático desactivado."

# Artículos disponibles en la tienda.
# Formato:
# "número":
#   itemId: ID del artículo
#   count: cantidad requerida
#   price: dinero recibido por esa cantidad
#   url: ruta o URL de la imagen

"0":
  itemId: 265 # Lingote de hierro
  count: 15
  price: 100
  url: "textures/items/iron_ingot"

"1":
  itemId: 266 # Lingote de oro
  count: 10
  price: 200
  url: "textures/items/gold_ingot"

"2":
  itemId: 264 # Diamante
  count: 5
  price: 500
  url: "textures/items/diamond"
